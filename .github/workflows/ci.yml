name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
      - name: Audit all dependencies (non-blocking)
        if: always()
        continue-on-error: true
        run: pnpm audit

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: docker pull postgres:17
      - run: pnpm test:integration
      - run: pnpm check:migrations

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_PORT: "3201"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @anar/web exec playwright install --with-deps chromium
      - run: pnpm e2e --reporter=line,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: error

  e2e-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @anar/web exec playwright install --with-deps chromium
      - run: pnpm --filter @anar/domain build
      - run: pnpm --filter @anar/web e2e:auth --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-auth-results
          path: apps/web/test-results/auth
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm smoke:compose
