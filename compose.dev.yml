services:
  api:
    image: anar-api:dev
    build:
      target: dev
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./packages/domain/src:/workspace/packages/domain/src:ro
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/packages/domain/node_modules

  worker:
    image: anar-worker:dev
    build:
      target: dev
    volumes:
      - ./apps/worker/src:/workspace/apps/worker/src:ro
      - /workspace/node_modules
      - /workspace/apps/worker/node_modules

  web:
    image: anar-web:dev
    build:
      target: dev
    volumes:
      - ./apps/web/app:/workspace/apps/web/app:ro
      - ./apps/web/components:/workspace/apps/web/components:ro
      - ./apps/web/lib:/workspace/apps/web/lib:ro
      - ./apps/web/mock:/workspace/apps/web/mock:ro
      - ./apps/web/modules:/workspace/apps/web/modules:ro
      - ./apps/web/next.config.ts:/workspace/apps/web/next.config.ts:ro
      - ./packages/domain/src:/workspace/packages/domain/src:ro
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/domain/node_modules
