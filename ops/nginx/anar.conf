# Include inside the shared nginx http block.
upstream anar_api_backend {
    zone anar_api_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server anar-api:3001 resolve;
}

upstream anar_web_backend {
    zone anar_web_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server anar-web:3000 resolve;
}

server {
    listen 80;
    server_name anar.visitshankhuwasabha.com;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/anar-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://anar.visitshankhuwasabha.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name anar.visitshankhuwasabha.com;
    ssl_certificate /etc/letsencrypt/anar/live/anar.visitshankhuwasabha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/anar/live/anar.visitshankhuwasabha.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25664k;
    client_body_timeout 125s;
    send_timeout 125s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 125s;
    proxy_send_timeout 125s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Forwarded "";
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api {
        proxy_pass http://anar_api_backend;
    }

    location ^~ /api/ {
        proxy_pass http://anar_api_backend;
    }

    location = /sw.js {
        proxy_pass http://anar_web_backend;
    }

    location / {
        proxy_pass http://anar_web_backend;
    }
}
