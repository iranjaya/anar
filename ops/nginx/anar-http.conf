# Include inside the shared nginx http block before the first certificate exists.
server {
    listen 80;
    server_name anar.visitshankhuwasabha.com;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/anar-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
